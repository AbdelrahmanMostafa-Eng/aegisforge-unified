name: AegisForge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Compile Python sources
        run: python -m compileall -q aegisforge tools
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: aegisforge validate . --json
      - name: Run scenario evaluation
        run: aegisforge evaluate evaluation/scenarios.json --json
      - name: Run diagnostics
        run: aegisforge doctor . --json
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check whitespace errors
        run: git diff --check
      - name: Check for accidental environment files
        run: '! find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) -not -path "./.git/*" | grep -q .'
