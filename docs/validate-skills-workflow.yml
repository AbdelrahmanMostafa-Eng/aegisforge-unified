name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install .

      - name: Validate repository contracts
        run: aegisforge validate . --json

      - name: Rebuild registry
        run: |
          aegisforge index .
          git diff --exit-code -- registry/skills.json

      - name: Run evaluation scenarios
        run: aegisforge evaluate evaluation/scenarios.json --json

      - name: Run diagnostics
        run: aegisforge doctor . --json

      - name: Run tests
        run: python -m unittest discover -s tests -v
