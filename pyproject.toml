[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisforge"
version = "0.2.0"
description = "A risk-aware, searchable, testable operating system for software engineering agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Abdelrahman Mostafa"}]
keywords = ["agents", "software-engineering", "skills", "security", "testing", "workflow", "routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
aegisforge = "aegisforge.cli:main"
skill = "aegisforge.cli:main"
skill-md = "aegisforge.cli:main"

[tool.setuptools.packages.find]
include = ["aegisforge*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
